name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.11
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check --select E4,E7,E9,F app.py src/predict.py tests
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q app.py train.py src tests
      - name: Build Docker image
        run: docker build --tag digit-cnn:ci .
